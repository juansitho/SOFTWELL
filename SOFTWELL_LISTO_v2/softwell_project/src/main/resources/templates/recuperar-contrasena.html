<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon-32.ico}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - SOFTWELL</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main style="max-width: 520px; margin: 8vh auto; padding: 32px; background: #fff; border-radius: 12px;">
    <h1>Recuperar contraseña</h1>
    <p>Ingresa el correo asociado a tu cuenta y te enviaremos un código de verificación.</p>

    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" role="alert" th:text="${error}"></div>

    <form th:action="@{/recuperar-contrasena}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" required
               style="display: block; box-sizing: border-box; width: 100%; margin: 8px 0 16px; padding: 12px;">
        <button type="submit" class="btn btn-primary">Enviar código</button>
    </form>

    <p>¿Ya tienes el código? <a th:href="@{/restablecer-contrasena}">Restablecer contraseña</a></p>
    <a th:href="@{/login}">Volver al inicio de sesión</a>
</main>
</body>
</html>
