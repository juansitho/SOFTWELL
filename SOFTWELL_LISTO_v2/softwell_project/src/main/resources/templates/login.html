<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="icon" type="image/x-icon" th:href="@{/favicon-32.ico}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicia Sesión - SOFTWELL</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }
    .login-page {
      --login-aqua: #00A6A6;
      --login-aqua-light: #D9F5F3;
      --login-white: #FFFFFF;
      --login-black: #111111;
      --login-muted: #6B7280;
      background: var(--login-white);
      color: var(--login-black);
    }
    .login-container {
      display: flex;
      min-height: 100vh;
      width: 100vw;
      align-items: stretch;
    }
    .login-box {
      flex: 1;
      max-width: 550px;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--login-white);
      box-shadow: 10px 0 30px rgba(0,0,0,0.05);
      z-index: 2;
    }
    .login-page .login-header h1,
    .login-page .form-group label { color: var(--login-black); }
    .login-page .login-header h1 {
      display: inline-block;
      box-sizing: border-box;
      max-width: 100%;
      padding: 12px 18px;
      border: 1.5px solid var(--login-aqua);
      border-radius: 16px;
      background: var(--login-aqua);
      color: var(--login-white);
    }
    .login-page .login-header p { color: var(--login-muted); }
    .login-page .form-group input {
      border: 1px solid var(--login-aqua-light);
      border-radius: 12px;
      color: var(--login-black);
    }
    .login-page .form-group input:focus {
      border-color: var(--login-aqua);
      box-shadow: 0 0 0 3px var(--login-aqua-light);
    }
    .login-page .btn-primary {
      border-radius: 50px;
      background: var(--login-aqua);
      color: var(--login-white);
      transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .login-page .btn-primary:hover {
      background: #008c8c;
      box-shadow: 0 8px 20px rgba(0,166,166,.22);
    }
    .login-page .btn::after { content: none; }
    .login-page .login-footer a {
      color: var(--login-aqua);
      transition: color .2s ease;
    }
    .login-page .login-footer a:hover { color: var(--login-black); }
    .login-page .alert-success,
    .login-page .alert-error {
      border: 1px solid var(--login-aqua-light);
      border-left: 3px solid var(--login-aqua);
      border-radius: 10px;
      background: var(--login-aqua-light);
      color: var(--login-black);
    }
    .login-background {
      flex: 1.5;
      display: block;
      position: relative;
      overflow: hidden;
      background: transparent;
    }
    .login-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 2px solid #ddd;
    }
    .login-tab {
      padding: 12px 20px;
      background: transparent;
      border: none;
      font-weight: 600;
      cursor: pointer;
      color: #999;
      transition: all 0.3s;
      border-bottom: 3px solid transparent;
    }
    .login-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .login-footer a { 
      font-size: 1rem; /* Reduce el tamaño de la letra */
      font-weight: 600;
    }
    .login-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
    }
    @media (max-width: 992px) {
      .login-background { display: none; }
      .login-box { max-width: 100%; width: 100%; padding: 40px 20px; }
      .login-header h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>SOFTWELL</h1>
        <p>Inicia sesión en tu cuenta</p>
      </div>

      <!-- Mensajes de error/éxito -->
      <div th:if="${error}" class="alert alert-error">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${error}"></span>
      </div>
      <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        <span th:text="${success}"></span>
      </div>

      <!--
        Spring Security procesa el login en /login-process.
        Un solo formulario sirve tanto para clientes como para admins:
        Spring Security redirigirá según el rol automáticamente.
      -->
      <form method="POST" th:action="@{/login-process}" class="login-form">
        <!-- Token CSRF obligatorio con Spring Security -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required autofocus>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>

      <div class="login-footer" style="margin-top: 10px;">
        <a th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="login-footer" style="margin-top: 15px;">
        ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
      </div>

      <div class="login-footer" style="margin-top: 10px; text-align: center;">
        <a th:href="@{/}">← Volver a la página principal</a>
      </div>
    </div>

    <div class="login-background">
      <video autoplay loop muted playsinline aria-label="Video de un diamante girando">
        <source th:src="@{/img/diamante.mp4}" type="video/mp4">
      </video>
    </div>
  </div>
</body>
</html>
