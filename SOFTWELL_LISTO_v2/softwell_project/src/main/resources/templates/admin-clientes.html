<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon-32.ico}">
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .clients-search {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 14px;
            border: 1px solid var(--admin-green-border);
            border-radius: 12px;
            background: var(--admin-green-soft);
        }
        .clients-search-field {
            position: relative;
            flex: 1;
            min-width: 0;
        }
        .clients-search-field > i {
            position: absolute;
            top: 50%;
            left: 14px;
            color: var(--admin-green-dark);
            transform: translateY(-50%);
        }
        .clients-search-field input {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px 10px 42px;
            border: 1px solid var(--admin-green-border);
            border-radius: 9px;
            box-sizing: border-box;
        }
        .clients-search button,
        .clients-search-clear {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: 0;
            border-radius: 9px;
            color: #fff;
            background: var(--admin-green-dark);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .clients-search button:hover { background: var(--admin-green-text); }
        .clients-search-clear {
            border: 1px solid var(--admin-green-border);
            color: var(--admin-green-text);
            background: #fff;
        }
        .clients-search-clear:hover { background: var(--admin-green-soft); }
        .clients-search-result {
            margin: 0 0 14px;
            color: var(--admin-green-text);
            font-size: 14px;
        }
        @media (max-width: 560px) {
            .clients-search { align-items: stretch; flex-wrap: wrap; }
            .clients-search-field { flex-basis: 100%; }
            .clients-search button,
            .clients-search-clear { flex: 1; }
        }
    </style>
</head>
<body class="admin-app">
<div class="admin-container">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>

    <main class="main-content admin-main-content">
        <header class="admin-header">
            <h1>Gestión de Clientes</h1>
        </header>

        <section class="content-section active">
            <div th:if="${success}" class="alert alert-success" style="background-color: #d4edda; color: #155724; border-color: #c3e6cb; margin-bottom: 20px;">
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-error" style="margin-bottom: 20px;">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="card shadow">
                <div class="card-header">
                    <h6 class="m-0 font-weight-bold text-primary"
                        th:text="${#strings.isEmpty(busqueda) ? 'Todos los Clientes' : 'Resultados de búsqueda'}">Todos los Clientes</h6>
                </div>
                <div class="card-body">
                    <form class="clients-search" th:action="@{/admin/clientes}" method="get" role="search">
                        <div class="clients-search-field">
                            <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                            <input type="search" name="busqueda" th:value="${busqueda}"
                                   placeholder="Buscar por número de teléfono o correo"
                                   aria-label="Buscar clientes por teléfono o correo">
                        </div>
                        <button type="submit"><i class="fas fa-search" aria-hidden="true"></i> Buscar</button>
                        <a th:if="${not #strings.isEmpty(busqueda)}" th:href="@{/admin/clientes}" class="clients-search-clear">
                            <i class="fas fa-times" aria-hidden="true"></i> Limpiar
                        </a>
                    </form>
                    <p class="clients-search-result"
                       th:if="${not #strings.isEmpty(busqueda)}"
                       th:text="${#lists.size(clientes)} + ' cliente(s) encontrado(s)'"></p>
                    <div class="table-responsive">
                        <table class="admin-table" width="100%" cellspacing="0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="6" class="text-center"
                                    th:text="${#strings.isEmpty(busqueda) ? 'No hay clientes registrados.' : 'No se encontraron clientes con ese teléfono o correo.'}">
                                    No se encontraron clientes.
                                </td>
                            </tr>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.id}">1</td>
                                <td th:text="${cliente.nombre}">Nombre Cliente</td>
                                <td th:text="${cliente.email}"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="3457585d515a4051745159555d581a575b59">[email&#160;protected]</a></td>
                                <td th:text="${cliente.telefono ?: 'N/A'}">3001234567</td>
                                <td>
                                    <span th:if="${cliente.estaActivo()}" class="badge badge-success">Activo</span>
                                    <span th:unless="${cliente.estaActivo()}" class="badge badge-danger">Inactivo</span>
                                </td>
                                <td style="display: flex; gap: 8px;">
                                    <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-info btn-sm" title="Editar"><i class="fas fa-edit"></i></a>
                                    <form th:if="${cliente.estaActivo()}" th:action="@{/admin/clientes/desactivar/{id}(id=${cliente.id})}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-warning btn-sm" title="Desactivar"><i class="fas fa-user-slash"></i></button></form>
                                    <form th:unless="${cliente.estaActivo()}" th:action="@{/admin/clientes/activar/{id}(id=${cliente.id})}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-success btn-sm" title="Activar"><i class="fas fa-user-check"></i></button></form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
