<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="sidebar">
    <button class="admin-sidebar-toggle" type="button" aria-label="Abrir menú de administración" aria-expanded="false" aria-controls="adminSidebar">
        <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <div class="admin-sidebar-backdrop" data-admin-sidebar-close></div>
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="admin-sidebar-header">
            <a th:href="@{/admin}" class="admin-sidebar-brand" aria-label="SOFTWELL, administración">
                <span class="admin-sidebar-mark"><i class="fas fa-gem" aria-hidden="true"></i></span>
                <span class="admin-sidebar-brand-copy">
                    <span class="admin-sidebar-name">SOFTWELL</span>
                    <span class="admin-sidebar-caption">ADMINISTRACIÓN</span>
                </span>
            </a>
        </div>
        <nav class="admin-sidebar-nav" aria-label="Administración">
            <p class="admin-sidebar-label">ADMINISTRACIÓN</p>
            <a th:href="@{/admin}" class="admin-sidebar-item" data-admin-route="dashboard"><i class="fas fa-chart-line" aria-hidden="true"></i><span>Dashboard</span></a>
            <a th:href="@{/admin/productos}" class="admin-sidebar-item" data-admin-route="products"><i class="fas fa-box-open" aria-hidden="true"></i><span>Productos</span></a>
            <a th:href="@{/admin/pedidos}" class="admin-sidebar-item" data-admin-route="orders"><i class="fas fa-receipt" aria-hidden="true"></i><span>Pedidos</span></a>
            <a th:href="@{/admin/ofertas}" class="admin-sidebar-item" data-admin-route="offers"><i class="fas fa-handshake" aria-hidden="true"></i><span>Ofertas</span></a>
            <a th:href="@{/admin/historial-ofertas}" class="admin-sidebar-item" data-admin-route="offer-history"><i class="fas fa-clock-rotate-left" aria-hidden="true"></i><span>Historial de ofertas</span></a>
            <a th:href="@{/admin/clientes}" class="admin-sidebar-item" data-admin-route="clients"><i class="fas fa-users" aria-hidden="true"></i><span>Clientes</span></a>
            <a th:href="@{/admin/testimonios}" class="admin-sidebar-item" data-admin-route="testimonials"><i class="fas fa-comment-dots" aria-hidden="true"></i><span>Testimonios</span></a>
            <a th:href="@{/admin/analitica}" class="admin-sidebar-item" data-admin-route="analytics"><i class="fas fa-chart-pie" aria-hidden="true"></i><span>Analítica</span></a>
            <a th:href="@{/admin/reportes}" class="admin-sidebar-item" data-admin-route="reports"><i class="fas fa-chart-bar" aria-hidden="true"></i><span>Reportes</span></a>
        </nav>
        <div class="admin-sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="admin-sidebar-logout"><i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i><span>Cerrar sesión</span></button>
            </form>
        </div>
    </aside>
    <script th:src="@{/js/admin-sidebar.js}" defer></script>
</th:block>
</body>
</html>
