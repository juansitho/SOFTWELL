<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon-32.ico}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${producto.nombre} + ' - SOFTWELL'">Producto</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="product-detail-page">
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">LJE</div>
      <nav class="main-nav">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/catalogo}">Catálogo</a>
        <a th:href="@{/carrito}" class="cart-link">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" th:if="${cartItemCount > 0}" th:text="${cartItemCount}">0</span>
        </a>
        <a th:href="@{/login}" class="btn btn-primary">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 40px 20px;">
    <div th:if="${success}" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${error}"></span>
    </div>

    <div class="product-detail-container">
      <div class="product-detail-image">
        <img th:src="${producto.imagen}" th:alt="${producto.nombre}" onerror="this.src='/img/placeholder.webp'">
      </div>

      <div class="product-detail-info">
        <div class="product-breadcrumb">
          <a th:href="@{/}">Inicio</a> / 
          <a th:href="@{/catalogo(categoria=${producto.categoria})}" th:text="${producto.categoria}">Categoría</a> / 
          <span th:text="${producto.nombre}">Producto</span>
        </div>

        <h1 th:text="${producto.nombre}">Nombre del Producto</h1>
        
        <div class="product-price-large" th:text="'COP $ ' + ${#numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}">COP $ 0</div>

        <div class="product-stock">
          <span th:if="${producto.stock > 0}" class="stock-available">
            <i class="fas fa-check-circle"></i> En stock (<span th:text="${producto.stock}">0</span> disponibles)
          </span>
          <span th:if="${producto.stock <= 0}" class="stock-unavailable">
            <i class="fas fa-times-circle"></i> Agotado
          </span>
        </div>

        <div class="product-description">
          <h3>Descripción</h3>
          <p th:text="${producto.descripcion}">Descripción del producto</p>
        </div>

        <form th:action="@{/productos/agregar-carrito}" method="post" class="add-to-cart-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" name="productId" th:value="${producto.id}">
          
          <div class="quantity-selector" style="margin-bottom: 15px;">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" value="1" min="1" th:max="${producto.stock}" style="width: 70px; padding: 8px; border-radius: 8px; border: 1px solid #ddd;">
          </div>

          <button type="submit" class="btn btn-primary btn-large" th:disabled="${producto.stock <= 0}">
            <i class="fas fa-shopping-cart"></i> Agregar al Carrito
          </button>
        </form>

        <div class="product-features">
          <div class="feature-item">
            <i class="fas fa-shield-alt"></i>
            <span>Garantía de autenticidad</span>
          </div>
          <div class="feature-item">
            <i class="fas fa-truck"></i>
            <span>Envío asegurado</span>
          </div>
          <div class="feature-item">
            <i class="fas fa-undo"></i>
            <span>30 días de devolución</span>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top: 30px;">
      <a th:href="@{/catalogo}" class="btn btn-ghost">← Volver al Catálogo</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>SOFTWELL</h4>
        <p>&copy; 2025 Todos los derechos reservados.</p>
      </div>
    </div>
  </footer>

  <style>
    .product-detail-page {
      --product-turquoise: #00b4b6;
      --accent: var(--product-turquoise);
      --accent-600: var(--product-turquoise);
    }

    .product-detail-page .site-header {
      background: #FFFFFF;
      border-bottom: 1px solid rgba(0, 180, 182, .25);
    }

    .product-detail-page .logo {
      width: 56px;
      height: 48px;
      padding: 0;
      border: 1px solid var(--product-turquoise);
      border-radius: 10px;
      background: var(--product-turquoise);
      color: #FFFFFF;
      letter-spacing: .08em;
    }

    .product-detail-page .main-nav { gap: 8px; }

    .product-detail-page .site-header .main-nav > a,
    .product-detail-page .site-header .main-nav > a:hover,
    .product-detail-page .site-header .main-nav > a:focus,
    .product-detail-page .site-header .main-nav > a:active,
    .product-detail-page .site-header .main-nav > a:visited {
      border: 1px solid var(--product-turquoise);
      border-radius: 50px;
      background: var(--product-turquoise);
      color: #FFFFFF;
      transition: none;
      transform: none;
      box-shadow: none;
    }

    .product-detail-page .site-header .main-nav > a::after {
      content: none;
      animation: none;
    }

    .product-detail-page .site-header .main-nav > a.cart-link {
      position: relative;
      display: inline-flex;
      width: 44px;
      height: 44px;
      padding: 0;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .product-detail-page .site-header .cart-badge {
      background: #FFFFFF;
      color: var(--product-turquoise);
    }

    .product-detail-page .add-to-cart-form .btn-primary,
    .product-detail-page .add-to-cart-form .btn-primary:hover,
    .product-detail-page .add-to-cart-form .btn-primary:focus,
    .product-detail-page .add-to-cart-form .btn-primary:active,
    .product-detail-page .add-to-cart-form .btn-primary:disabled {
      border-color: var(--product-turquoise);
      background: var(--product-turquoise);
      background-image: none;
      color: #FFFFFF;
      transition: none;
      transform: none;
      box-shadow: none;
    }

    .product-detail-page .add-to-cart-form .btn-primary::after {
      content: none;
      animation: none;
    }

    .product-detail-page main .btn-ghost,
    .product-detail-page main .btn-ghost:hover,
    .product-detail-page main .btn-ghost:focus,
    .product-detail-page main .btn-ghost:active {
      border: 1px solid var(--product-turquoise);
      background: #FFFFFF;
      color: var(--product-turquoise);
      transition: none;
      transform: none;
      box-shadow: none;
    }

    .product-detail-page main .btn-ghost::after {
      content: none;
      animation: none;
    }

    .product-detail-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-top: 20px;
    }

    .product-detail-image {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--card);
    }

    .product-detail-image img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .product-detail-info {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .product-breadcrumb {
      color: var(--muted);
      font-size: 14px;
    }

    .product-breadcrumb a {
      color: var(--accent);
      text-decoration: none;
    }

    .product-detail-info h1 {
      font-size: 32px;
      margin: 0;
      font-family: 'Playfair Display', serif;
    }

    .product-price-large {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
    }

    .product-stock {
      padding: 10px 0;
      font-weight: 600;
    }

    .stock-available {
      color: #2d5e2d;
    }

    .stock-unavailable {
      color: #c33;
    }

    .product-description {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid var(--accent);
    }

    .product-description h3 {
      margin-top: 0;
      color: var(--dark);
    }

    .add-to-cart-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px 0;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-selector input {
      width: 80px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .btn-large {
      padding: 15px 30px;
      font-size: 18px;
    }

    .product-features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
    }

    .feature-item i {
      color: var(--accent);
      font-size: 20px;
    }

    .cart-link {
      position: relative;
      padding: 10px 15px;
    }

    .cart-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .product-detail-page .alert-success {
      background: var(--product-turquoise);
      color: #FFFFFF;
      border: 1px solid var(--product-turquoise);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .product-detail-page .alert-success i {
      color: #FFFFFF;
    }

    @media (max-width: 768px) {
      .product-detail-container {
        grid-template-columns: 1fr;
      }
    }

  </style>
</body>
</html>
